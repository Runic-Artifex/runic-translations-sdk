name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Check generated CLDR selectors and capability matrix
        run: bun eng/generate-cldr.mjs --check
      - name: Check rendered capability documentation
        run: bun eng/render-capabilities.mjs --check
      # runic-sdk's flake provides the same actionlint version for local runs.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # verify-packages serves the SvelteKit quick start with adapter-node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test eng/release
      - run: bun eng/run.mjs test
      - run: bun eng/verify-packages.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runic-translations-packages
          path: artifacts/packages
          if-no-files-found: ignore
          # Publish preview reuses this artifact of a successful push run on main.
          retention-days: 30
  inline-browser:
    name: Svelte inline SSR and browser hydration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install the locked Chromium browser
        working-directory: packages/web/translations-svelte
        run: |
          "$GITHUB_WORKSPACE/eng/ci/install-chromium.sh"
          bun -e 'import { chromium } from "playwright-core"; console.log("PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Verify inline and document SSR identity and real browser hydration
        working-directory: packages/web/translations-svelte
        run: bun run --bun test:inline-browser
  rmf2-native-aot:
    name: RMF2 NativeAOT / linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install NativeAOT toolchain
        run: eng/ci/apt-install.sh clang zlib1g-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun eng/run.mjs native-aot
  wpf:
    name: WPF / Windows
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet run --project tests/dotnet/Runic.Translations.Wpf.Tests/Runic.Translations.Wpf.Tests.csproj --configuration Release
  editor-e2e:
    name: Editor / hosted RMF2 E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build Translations and the editor
        run: bun eng/run.mjs build
      - name: Validate the example translation workspace
        run: dotnet apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll validate apps/translations-editor/ExampleWorkspace
      - name: Install the locked E2E harness and Chromium
        working-directory: apps/translations-editor/tests/HostedBrowserE2E
        run: |
          bun install --frozen-lockfile
          "$GITHUB_WORKSPACE/eng/ci/install-chromium.sh"
          bun -e 'import { chromium } from "playwright-core"; console.log("WEBUI_BROWSER_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Verify real hosted editor RMF2 editing and recovery
        run: bun apps/translations-editor/tests/HostedBrowserE2E/run-hosted-rmf2-ui.mjs apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll
        env:
          RUNIC_EDITOR_HOSTED_E2E_REPORT_DIR: ${{ github.workspace }}/artifacts/editor-hosted-rmf2-ui
      - name: Retain hosted editor browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-hosted-rmf2-ui
          path: artifacts/editor-hosted-rmf2-ui
          if-no-files-found: ignore
  editor-packed:
    name: Editor / packed Translations packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build the editor against freshly packed Translations packages
        run: bun eng/run.mjs verify-editor-packed
      - name: Install the locked E2E harness and Chromium
        working-directory: apps/translations-editor/tests/HostedBrowserE2E
        run: |
          bun install --frozen-lockfile
          "$GITHUB_WORKSPACE/eng/ci/install-chromium.sh"
          bun -e 'import { chromium } from "playwright-core"; console.log("WEBUI_BROWSER_PATH=" + chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Verify real hosted editing with the packed editor build
        run: bun apps/translations-editor/tests/HostedBrowserE2E/run-hosted-rmf2-ui.mjs apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll
        env:
          RUNIC_EDITOR_HOSTED_E2E_REPORT_DIR: ${{ github.workspace }}/artifacts/editor-hosted-packed
      - name: Retain packed editor browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-hosted-packed
          path: artifacts/editor-hosted-packed
          if-no-files-found: ignore
  ide-packaging:
    name: IDE / VS Code extension package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # Packaging stamps the eng/workspace.json release version (eng/release/ide-versions.mjs) and checks the VSIX.
      # The second package (not uploaded) checks that a final release drops the pre-release and Preview flags.
      - name: Build, test and package the VS Code extension
        working-directory: tools/vscode-runic-translations
        run: |
          bun install --frozen-lockfile
          bun run --bun check
          bun run --bun test
          bun run package
          node package.mjs 0.6.0 "$RUNNER_TEMP/final-release-check.vsix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rmf2-vscode-vsix
          path: tools/vscode-runic-translations/artifacts/runic-translations.vsix
          if-no-files-found: error
          # Kept as long as the package artifact: Publish preview releases it.
          retention-days: 30
  vsix:
    name: IDE / Windows VSIX package
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Build the language server
        run: dotnet build tools/dotnet-runic-translations/dotnet-runic-translations.csproj -c Release
      # The project stamps the VSIX version from eng/workspace.json; package.py checks it.
      - name: Build the native VSIX with full-framework MSBuild
        run: msbuild tools/visualstudio-runic-translations/Runic.Translations.VisualStudio.csproj /restore /m:1 /p:Configuration=Release
      - name: Verify the generated VSIX against the source manifest
        run: python tools/visualstudio-runic-translations/package.py --configuration Release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rmf2-visualstudio-vsix
          path: tools/visualstudio-runic-translations/artifacts/runic-translations-visualstudio.vsix
          if-no-files-found: error
          # Kept as long as the package artifact: Publish preview releases it.
          retention-days: 30
  verify:
    name: verify
    if: always()
    needs: [source-checks, build-and-test, inline-browser, rmf2-native-aot, wpf, editor-e2e, editor-packed, ide-packaging, vsix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != success ]]; then
              echo "Verification is incomplete: $RESULTS"
              exit 1
            fi
          done
