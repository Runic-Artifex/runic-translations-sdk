name: CI

# Pull request branches run through `pull_request` only. The macOS jobs run in nightly and manual runs and for a version
# or release commit on main (eng/ci/full-run-paths.txt), and on a pull request or another push to main only when it
# changes a path they exercise (eng/ci/macos-paths.txt). A run that runs them runs every job and uploads the ci-full-run
# artifact; Publish preview and the runic-sdk train take a commit's packages only from such a full green run on main
# (CONTRIBUTING.md, "CI triggers and macOS jobs").
on:
  push:
    branches: [main]
  pull_request:
  # Nightly, every job on every platform.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its running CI. Every other run has its own group, so no main push run is
# cancelled or replaced while it waits.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether the macOS jobs run (eng/ci/macos-changes.sh): for a pull request, when its test merge commit changes a path
  # in eng/ci/macos-paths.txt against the base branch (the merge commit's first parent); for a push to main, the same
  # against the previous main commit, and always for a version or release commit (eng/ci/full-run-paths.txt); always
  # in nightly and manual runs. Such a run runs every job, and outside pull requests it uploads the ci-full-run marker.
  changes:
    name: Platform paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      macos: ${{ steps.paths.outputs.macos }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide whether the macOS jobs run
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          event="$EVENT"
          # A push compares with the previous main commit. A push that moved main by more than one commit runs every job
          # rather than miss a path that an earlier commit of it changed.
          if [[ "$event" == push && "$BEFORE" != "$(git rev-parse HEAD^1)" ]]; then
            echo "This push moved main from ${BEFORE:-nothing}, not from the first parent of $GITHUB_SHA."
            event=push-range
          fi
          bash eng/ci/macos-changes.sh --event "$event" HEAD^1 HEAD
      # Publish preview and the runic-sdk train take a commit's packages only from a full green run on main and find it
      # by this artifact (CONTRIBUTING.md, "CI triggers and macOS jobs").
      - name: Mark the full run
        if: steps.paths.outputs.full == 'true' && github.event_name != 'pull_request'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-full-run"
          jq -n --arg event "$EVENT" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schema: "runic.ci.full-run/1", event: $event, sha: $sha, run: $run}' > "$RUNNER_TEMP/ci-full-run/full-run.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.paths.outputs.full == 'true' && github.event_name != 'pull_request'
        with:
          name: ci-full-run
          path: ${{ runner.temp }}/ci-full-run
          if-no-files-found: error
          # As long as the package artifact it vouches for.
          retention-days: 30
          overwrite: true
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The first parent, for the vendored conformance core's upstream comparison.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check generated CLDR selectors and capability matrix
        run: bun eng/generate-cldr.mjs --check
      - name: Test the CLDR plural rule parser and bytecode
        run: bun test eng/cldr-plural-rules.test.mjs
      # eng/ci/apt-install.sh against a stubbed sudo, apt-get and curl (CONTRIBUTING.md, "Ubuntu packages in CI").
      - name: Test the Ubuntu package installer
        run: bun test --timeout 180000 eng/ci/apt-install.test.mjs
      - name: Test the macOS path rule
        run: bun test eng/ci/macos-changes.test.mjs
      # The vendored conformance driver core (eng/conformance/README.md). Offline, on every run: the copy matches its
      # stamp. The comparison with runic-sdk at the pinned commit needs the network, so it runs only when the copy or the
      # stamp changes, as the Cargo.lock checks run only on lock changes (R1 section 7).
      - name: Test the vendored conformance driver core
        run: bun test eng/conformance/vendor.test.mjs
      - name: Compare the vendored conformance driver core with runic-sdk
        run: |
          if git diff --quiet HEAD^1 HEAD -- eng/conformance/core eng/conformance/core.vendor.json; then
            echo "The vendored core and its stamp are unchanged; the offline check covers them."
          else
            bun eng/conformance/vendor.mjs upstream
          fi
      # The Translations conformance module (eng/conformance/README.md, "Translations"): the committed case list is current
      # and every status file follows its rules and covers exactly the corpus's cases.
      - name: Check the conformance case list and status files
        run: |
          bun eng/conformance/cli.ts cases
          bun eng/conformance/cli.ts lint
      - name: Check rendered capability documentation
        run: bun eng/render-capabilities.mjs --check
      # runic-sdk's flake provides the same actionlint version for local runs.
      - name: Lint workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
  # The train feed (eng/train-feed.mjs): while the Runic Command Line release in eng/Versions.props is not on nuget.org,
  # the managed jobs build against its candidate, which this job takes from runic-cli-sdk's CI or packs from its source.
  # Such a run uploads the train-feed artifact, and Publish preview refuses it. Once Command Line is published, active is
  # false and nothing else changes.
  train-feed:
    name: Train feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      active: ${{ steps.feed.outputs.active }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Prepare the Runic Command Line train feed
        id: feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/train-feed.mjs prepare
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.feed.outputs.active == 'true'
        with:
          name: train-feed
          path: artifacts/train-feed
          if-no-files-found: error
          retention-days: 30
  build-and-test:
    name: Build and test
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The npm archives' gitHead is the commit that last changed each package's inputs (eng/release/npm-inputs.mjs).
          fetch-depth: 0
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # verify-packages serves the SvelteKit quick start with adapter-node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test eng/release
      - run: bun eng/run.mjs test
      - name: Run the Bun operation-history example outside Vite
        run: bun examples/bun/operation-history/verify.ts
      # The Translations corpus through the conformance driver and its .NET and generated ESM adapters: each run must match
      # its status file (eng/conformance/README.md, "Translations"). The receipts are in artifacts/conformance.
      - name: Run the conformance driver against the .NET and ESM adapters
        run: |
          bun eng/conformance/cli.ts dotnet-translations
          bun eng/conformance/cli.ts esm-translations
      # The ESM half of the localized formatting corpus ran under Bun (JavaScriptCore) above; this runs it under Node (V8).
      - name: Run the localized formatting conformance under Node
        run: |
          dotnet run --project tests/dotnet/Runic.Translations.Compiler.Tests/Runic.Translations.Compiler.Tests.csproj --configuration Release -- --treenode-filter "/*/*/Rmf2DatePercentConformanceTests/Esm" --test-parameter esm-host=node --minimum-expected-tests 1
          dotnet run --project tests/dotnet/Runic.Translations.Compiler.Tests/Runic.Translations.Compiler.Tests.csproj --configuration Release -- --treenode-filter "/*/*/Rmf2EsmLocalizedFormattingTests/*" --test-parameter esm-host=node --minimum-expected-tests 1
          dotnet run --project tests/dotnet/Runic.Translations.Compiler.Tests/Runic.Translations.Compiler.Tests.csproj --configuration Release -- --treenode-filter "/*/*/LocalizedFormatComparisonTests/*" --test-parameter esm-host=node --minimum-expected-tests 1
      # The component-library example's hydration check launches the runner image's Chrome through playwright-core,
      # which saves the minutes of installing the locked Chromium in this job.
      - name: Verify the packages and examples
        run: |
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(command -v google-chrome || true)"
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH
          bun eng/verify-packages.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runic-translations-packages
          path: artifacts/packages
          if-no-files-found: ignore
          # Publish preview reuses this artifact of a successful full run on main (the changes job's ci-full-run).
          retention-days: 30
      # TRX and Cobertura coverage of the TUnit suites (see CONTRIBUTING.md).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runic-translations-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
  node-26:
    # engines allows Node 24 and 26; the other jobs run Node 24.22.3, this one the npm package tests on Node 26.
    name: npm packages / Node 26
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.12.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Test the Svelte and SvelteKit packages on Node 26
        run: |
          node --version
          (cd packages/web/translations-svelte && bun run test)
          bun install --frozen-lockfile
          (cd packages/web/translations-sveltekit && bun run test)
  inline-browser:
    name: Svelte inline SSR and browser hydration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the locked Chromium browser
        uses: ./.github/actions/install-chromium
        with:
          working-directory: packages/web/translations-svelte
      - name: Verify inline and document SSR identity and real browser hydration
        working-directory: packages/web/translations-svelte
        run: bun run --bun test:inline-browser
  rmf2-document-example:
    name: RMF2 document example / Chromium
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the locked Chromium browser
        uses: ./.github/actions/install-chromium
        with:
          working-directory: packages/web/translations-svelte
      - name: Generate the maintained document example and verify it in Chromium
        working-directory: packages/web/translations-svelte
        run: bun run --bun test:document-example
  vite-hmr:
    name: Vite in-place message updates / Chromium
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Install the locked Chromium browser
        uses: ./.github/actions/install-chromium
        with:
          working-directory: packages/web/translations-svelte
      - name: Build the Vite plugin and translations-svelte
        run: |
          (cd packages/web/vite-plugin-runic-translations && bun run --bun build)
          (cd packages/web/translations-svelte && bun run --bun build)
      - name: Edit messages under a dev server and verify in-place updates in Chromium
        working-directory: packages/web/translations-svelte
        run: bun run --bun test:hmr
  rmf2-native-aot:
    name: RMF2 NativeAOT / linux-x64
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install NativeAOT toolchain
        uses: ./.github/actions/apt-install
        with:
          packages: clang zlib1g-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun eng/run.mjs native-aot
  wpf:
    name: WPF / Windows
    needs: train-feed
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # The WPF TUnit suite on its STA dispatcher thread, with TRX and Cobertura coverage like the other suites.
      # The results directory is absolute: MTP resolves a relative one for TRX against the output directory.
      - name: Run the WPF adapter tests
        run: >-
          dotnet run --project tests/dotnet/Runic.Translations.Wpf.Tests/Runic.Translations.Wpf.Tests.csproj --configuration Release --
          --minimum-expected-tests 49
          --results-directory "${{ github.workspace }}/artifacts/test-results/Runic.Translations.Wpf.Tests"
          --report-trx --report-trx-filename Runic.Translations.Wpf.Tests.trx
          --coverage --coverage-output-format cobertura --coverage-output Runic.Translations.Wpf.Tests.cobertura.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: runic-translations-wpf-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
      - name: Build the interactive WPF document sample
        run: dotnet build examples/wpf/document-sample/Runic.Translations.Wpf.DocumentSample.csproj --configuration Release
      - name: Verify real WPF Page translation diagnostics
        run: dotnet run --project tests/dotnet/Runic.Translations.Build.Tests/Runic.Translations.Build.Tests.csproj --configuration Release -- --treenode-filter "/*/*/XamlBuildTests/*" --test-parameter xaml-wpf=true --minimum-expected-tests 3
  # Localized dates, times, zones and percentages come from platform data: .NET reads Windows' icu.dll or Apple's ICU
  # there, and the ESM half runs in Bun and Node. Only the formatting tests run, one job per platform.
  formatting-windows:
    name: Localized formatting / Windows
    needs: train-feed
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run the localized formatting tests and conformance corpus
        shell: bash
        run: bash eng/ci/localized-formatting.sh
      # Windows path rules (WIN-04): the path containment and RMF2 workspace cases, which attribute files to source
      # roots. Linux runs them in the full suite.
      - name: Run the path containment and RMF2 workspace tests
        shell: bash
        run: >-
          dotnet run --project tests/dotnet/Runic.Translations.Authoring.Tests --configuration Release --
          --treenode-filter "/*/*/(PathContainmentTests)|(Rmf2AuthoringTests)/*" --minimum-expected-tests 41
  formatting-macos:
    name: Localized formatting / macOS
    needs: [changes, train-feed]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Run the localized formatting tests and conformance corpus
        run: bash eng/ci/localized-formatting.sh
  # The editor's Runic Desktop window on Windows (WebView2) and macOS (WKWebView): publish for the runtime, then open the
  # example workspace in the native window until its page has connected, close it, and check the native-shell evidence
  # (eng/ci/editor-native-canary.sh). Linux does the same in editor-e2e under Xvfb.
  editor-windows:
    name: Editor / native window / win-x64
    needs: train-feed
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # runic-sdk I-176: each embedded window creates a fresh WebView2 profile under TEMP, and its first request waits for
      # the profile's cookie database, which on hosted windows-2025 can take seconds on C:. RUNNER_TEMP is on D:.
      - name: Temporary files on the runner's local disk
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Publish the editor for win-x64
        run: bun eng/run.mjs publish-editor win-x64
      - name: Open and close the native editor window (WebView2)
        timeout-minutes: 5
        shell: bash
        run: bash eng/ci/editor-native-canary.sh artifacts/editor-win-x64 webview2 artifacts/editor-canary "$(bun eng/release/editor-release.mjs version)"
      - name: Retain the native editor canary logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-native-canary-win-x64
          path: artifacts/editor-canary
          if-no-files-found: ignore
  editor-macos:
    name: Editor / native window / osx-arm64
    needs: [changes, train-feed]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Publish the editor for osx-arm64
        run: bun eng/run.mjs publish-editor osx-arm64
      # The hosted runner's logged-in GUI session shows the window, as in runic-sdk's macOS native leg.
      - name: Open and close the native editor window (WKWebView)
        timeout-minutes: 5
        run: bash eng/ci/editor-native-canary.sh artifacts/editor-osx-arm64 wkwebview artifacts/editor-canary "$(bun eng/release/editor-release.mjs version)"
      - name: Retain the native editor canary logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-native-canary-osx-arm64
          path: artifacts/editor-canary
          if-no-files-found: ignore
  editor-e2e:
    name: Editor / hosted RMF2 E2E
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build Translations and the editor
        run: bun eng/run.mjs build
      - name: Validate the example translation workspace
        run: dotnet apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll validate apps/translations-editor/ExampleWorkspace
      # The editor's Runic Desktop host on Linux: GTK 4 with WebKitGTK 6, under Xvfb (runic-sdk's native leg does the same).
      - name: Install the GTK 4 and WebKitGTK 6 runtime
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkitgtk-6.0-4 xvfb dbus-x11 at-spi2-core
      - name: Permit the WebKit sandbox on Ubuntu
        run: eng/ci/permit-webkit-sandbox.sh
      - name: Open and close the native editor window (GTK 4 / WebKitGTK 6)
        timeout-minutes: 3
        run: GDK_BACKEND=x11 xvfb-run -a dotnet apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll edit --native-shell-canary
      - name: Install the locked E2E harness
        working-directory: apps/translations-editor/tests/HostedBrowserE2E
        run: bun install --frozen-lockfile
      - name: Install the locked Chromium browser
        uses: ./.github/actions/install-chromium
        with:
          working-directory: apps/translations-editor/tests/HostedBrowserE2E
      - name: Verify real hosted editor RMF2 editing and recovery
        run: bun apps/translations-editor/tests/HostedBrowserE2E/run-hosted-rmf2-ui.mjs apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll
        env:
          RUNIC_EDITOR_HOSTED_E2E_REPORT_DIR: ${{ github.workspace }}/artifacts/editor-hosted-rmf2-ui
      - name: Retain hosted editor browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-hosted-rmf2-ui
          path: artifacts/editor-hosted-rmf2-ui
          if-no-files-found: ignore
  editor-packed:
    name: Editor / packed Translations packages
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The npm archives' gitHead is the commit that last changed each package's inputs (eng/release/npm-inputs.mjs).
          fetch-depth: 0
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build the editor against freshly packed Translations packages
        run: bun eng/run.mjs verify-editor-packed
      - name: Install the locked E2E harness
        working-directory: apps/translations-editor/tests/HostedBrowserE2E
        run: bun install --frozen-lockfile
      - name: Install the locked Chromium browser
        uses: ./.github/actions/install-chromium
        with:
          working-directory: apps/translations-editor/tests/HostedBrowserE2E
      - name: Verify real hosted editing with the packed editor build
        run: bun apps/translations-editor/tests/HostedBrowserE2E/run-hosted-rmf2-ui.mjs apps/translations-editor/bin/Release/net10.0/Runic.Translations.Editor.dll
        env:
          RUNIC_EDITOR_HOSTED_E2E_REPORT_DIR: ${{ github.workspace }}/artifacts/editor-hosted-packed
      - name: Retain packed editor browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-hosted-packed
          path: artifacts/editor-hosted-packed
          if-no-files-found: ignore
  # A minimal stdio LSP client, as Neovim or Helix is one, against the packed tool installed as a local tool and
  # started with `dotnet tool run runic-translations -- lsp`, without initializationOptions (eng/lsp-smoke.mjs).
  lsp-generic-client:
    name: Language server / generic client
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun eng/run.mjs lsp-smoke
  # The language server's large-catalog budgets (tests/lsp-budget): a catalog of 20,000 messages in 10 locales, measured
  # over stdio against the built tool. The limits are set for this runner (ubuntu-24.04, 4 processors).
  lsp-budget:
    name: Language server / large-catalog budgets
    needs: train-feed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/train-feed
        with:
          active: ${{ needs.train-feed.outputs.active }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun eng/run.mjs lsp-budget
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lsp-budget-results
          path: artifacts/lsp-budget/results.json
          if-no-files-found: ignore
          retention-days: 30
  verify:
    name: verify
    if: always()
    needs: [changes, source-checks, train-feed, build-and-test, node-26, inline-browser, rmf2-document-example, vite-hmr, rmf2-native-aot, wpf, formatting-windows, formatting-macos, editor-windows, editor-macos, editor-e2e, editor-packed, lsp-generic-client, lsp-budget]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A macOS job may be skipped only when the changes job decided so for a pull request or a push to main.
      - name: Require every verification job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          MACOS: ${{ needs.changes.outputs.macos }}
          MACOS_JOBS: formatting-macos editor-macos
        run: |
          incomplete=false
          while IFS='=' read -r job result; do
            if [[ "$result" == success ]]; then continue; fi
            if [[ "$result" == skipped && "$MACOS" == false && " $MACOS_JOBS " == *" $job "* ]]; then
              echo "$job: skipped, no macOS path changed"
              continue
            fi
            echo "$job: $result"
            incomplete=true
          done < <(jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<< "$NEEDS")
          if [[ "$incomplete" == true ]]; then
            echo "Verification is incomplete."
            exit 1
          fi
