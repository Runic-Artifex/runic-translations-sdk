name: Publish preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer preview version
        required: true
        type: string
      dry-run:
        description: Check the CI artifact, registries and release without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-preview-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Read-only: finds the successful CI push run for this commit, verifies its
  # packages and checks NuGet, npm, tag, release and npm latest. A dry run ends
  # here; this job never holds OIDC or write permissions.
  candidate:
    if: github.repository == 'Runic-Artifex/runic-translations-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      ci-run-id: ${{ steps.ci.outputs.run-id }}
      artifact: ${{ steps.ci.outputs.artifact }}
    env:
      # Pass the dispatch input through the environment, never into script text.
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          test "$version" = "$(jq -r .version eng/workspace.json)"
          test "$version" = "$(sed -n 's:.*<RunicTranslationsVersion>\(.*\)</RunicTranslationsVersion>.*:\1:p' eng/Versions.props)"
      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/ci-artifact.mjs find-ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.ci.outputs.artifact }}
          path: artifacts/packages
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify packages against the version and commit
        id: prepare
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
        run: |
          mkdir -p artifacts/release
          bun eng/release/ci-artifact.mjs prepare artifacts/packages "$VERSION" "$CI_RUN_ID" artifacts/release/packages.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release/packages.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Check registries without publishing
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun eng/release/publish.mjs publish "$VERSION" --dry-run
      - name: Check tag and release without creating them
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/ci-artifact.mjs release-check "$VERSION"
      - name: Check npm latest without moving it
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun eng/release/publish.mjs tag-latest "$VERSION" --dry-run

  publish:
    needs: candidate
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: write
      id-token: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      # npm 11.21 or newer can move dist-tags through trusted publishing (OIDC).
      - run: npm install --global npm@12.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: artifacts/packages
          run-id: ${{ needs.candidate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
      - name: Verify packages against the candidate inventory
        run: bun eng/release/ci-artifact.mjs verify artifacts/packages artifacts/release/packages.json
      - id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish missing packages or verify prior publication
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bun eng/release/publish.mjs publish "$VERSION"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" artifacts/packages/nuget/*.nupkg artifacts/packages/npm/*.tgz --target "$GITHUB_SHA" --prerelease --generate-notes
      - name: Move npm latest to this preview
        run: bun eng/release/publish.mjs tag-latest "$VERSION"
      - name: Note the documentation catalog step
        run: echo "Published $VERSION. Update the docs catalog in runic-site (see eng/release/README.md)." >> "$GITHUB_STEP_SUMMARY"
