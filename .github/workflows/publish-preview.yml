name: Publish preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version, x.y.z-preview.N (1-999) or x.y.z
        required: true
        type: string
      dry-run:
        description: Check the CI artifact, registries and release without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-preview-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Read-only: finds the successful CI push run for this commit, verifies its
  # packages and VSIX files, writes their SBOM and checks NuGet, npm, tag, release
  # and npm latest. A dry run ends here; this job never holds OIDC, attestation
  # or write permissions.
  candidate:
    if: github.repository == 'Runic-Artifex/runic-translations-sdk' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      ci-run-id: ${{ steps.ci.outputs.run-id }}
      artifact-id: ${{ steps.ci.outputs.artifact-id }}
      vsix-artifact-ids: ${{ steps.ci.outputs.vsix-artifact-ids }}
      # sha256sum lines of every candidate file; publish checks its download against them.
      release-sha256: ${{ steps.describe.outputs.sha256 }}
      sbom: ${{ steps.describe.outputs.sbom }}
    env:
      # Pass the dispatch input through the environment, never into script text.
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          # The IDE extension versions cannot express another prerelease label, so CI never packages one
          # (eng/release/ide-versions.mjs, the same pattern; README "IDE extension versions").
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-preview\.[1-9][0-9]{0,2})?$ ]]; then
            echo "::error::Version '$version' is not x.y.z-preview.N (1 <= N <= 999) or a final x.y.z; IDE extension packaging rejects every other version, so CI cannot have built it."
            exit 1
          fi
          # Also enforces the 65534 component limit and prints the IDE versions this release maps to.
          bun eng/release/ide-versions.mjs "$version"
          test "$version" = "$(jq -r .version eng/workspace.json)"
          test "$version" = "$(sed -n 's:.*<RunicTranslationsVersion>\(.*\)</RunicTranslationsVersion>.*:\1:p' eng/Versions.props)"
      - name: Find the successful CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/ci-artifact.mjs find-ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.ci.outputs.artifact-id }}
          path: artifacts/packages
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      # Two ids: each VSIX artifact is extracted into artifacts/vsix/<artifact name>.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.ci.outputs.vsix-artifact-ids }}
          path: artifacts/vsix
          run-id: ${{ steps.ci.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify packages and VSIX files against the version and commit
        id: prepare
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
        run: |
          mkdir -p artifacts/release
          bun eng/release/ci-artifact.mjs prepare artifacts/packages "$VERSION" "$CI_RUN_ID" artifacts/release/packages.json artifacts/vsix
      # Standard library only: the SBOM generator installs and executes nothing from the packages.
      - name: Describe the release (CycloneDX SBOM)
        id: describe
        run: |
          bun eng/release/ci-artifact.mjs describe artifacts/packages artifacts/vsix "$VERSION" artifacts/release
          {
            echo 'sha256<<SHA256'
            (cd artifacts/release && sha256sum -- *)
            echo SHA256
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
          overwrite: true
      - name: Check registries without publishing
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun eng/release/publish.mjs publish "$VERSION" --dry-run
      - name: Check tag and release without creating them
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun eng/release/ci-artifact.mjs release-check "$VERSION"
      - name: Check npm latest without moving it
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: bun eng/release/publish.mjs tag-latest "$VERSION" --dry-run

  publish:
    needs: candidate
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      # npm 11.21 or newer can move dist-tags through trusted publishing (OIDC).
      - run: npm install --global npm@12.2.0 --ignore-scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact-id }}
          path: artifacts/packages
          run-id: ${{ needs.candidate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.vsix-artifact-ids }}
          path: artifacts/vsix
          run-id: ${{ needs.candidate.outputs.ci-run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/release
      - name: Check the candidate files against the candidate job
        working-directory: artifacts/release
        env:
          RELEASE_SHA256: ${{ needs.candidate.outputs.release-sha256 }}
        run: |
          test -n "$RELEASE_SHA256"
          printf '%s\n' "$RELEASE_SHA256" | sha256sum --check --strict
      - name: Verify packages and VSIX files against the candidate inventory
        env:
          CI_RUN_ID: ${{ needs.candidate.outputs.ci-run-id }}
        run: bun eng/release/ci-artifact.mjs verify artifacts/packages artifacts/release/packages.json "$VERSION" "$CI_RUN_ID" artifacts/vsix
      # Attest the verified bytes before anything is published: every package and release asset.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/nuget/*.nupkg
            artifacts/packages/npm/*.tgz
            artifacts/vsix/*/*.vsix
            artifacts/release/${{ needs.candidate.outputs.sbom }}
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/packages/nuget/*.nupkg
            artifacts/packages/npm/*.tgz
            artifacts/vsix/*/*.vsix
          sbom-path: artifacts/release/${{ needs.candidate.outputs.sbom }}
      - id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish missing packages or verify prior publication
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bun eng/release/publish.mjs publish "$VERSION"
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SBOM: ${{ needs.candidate.outputs.sbom }}
        run: bun eng/release/ci-artifact.mjs release "$VERSION" artifacts/packages artifacts/vsix "artifacts/release/$SBOM"
      - name: Move npm latest to this preview
        run: bun eng/release/publish.mjs tag-latest "$VERSION"
      - name: Note the documentation catalog step
        run: echo "Published $VERSION. Update the docs catalog in runic-site (see eng/release/README.md)." >> "$GITHUB_STEP_SUMMARY"
